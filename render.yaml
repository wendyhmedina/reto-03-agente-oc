# Blueprint de Render: New → Blueprint → seleccionar este repositorio.
services:
  - type: web
    name: agente-oc-reto03
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false   # se escribe en el panel de Render; nunca en el repositorio
      - key: LLM_MODEL
        sync: false   # opcional
      - key: LLM_TIMEOUT_MS
        value: "180000"   # el nivel gratuito limita tokens por minuto: el agente espera y reintenta
      - key: MAX_ITERACIONES
        value: "25"
      - key: MAX_TOKENS_SESION
        value: "300000"
      - key: APP_ACCESS_KEY
        sync: false   # opcional: protege el link durante la defensa
